name: Awesome EEG-FM Sync

# Sync new EEG foundation models (paper_type=new_model) into iroblesrazzaq/awesome-eeg-fm.
# After a successful Daily Digest, scan every published month so backfills and
# recovery windows are not dropped. Manual dispatch can still target one month.
# Requires the EEG-FM Daily Digest GitHub App installed on BOTH this repo and
# awesome-eeg-fm with Contents + Pull requests permissions.
on:
  workflow_run:
    workflows: ["Daily Digest"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      month:
        description: 'Digest month YYYY-MM. Leave empty to sync current and previous UTC months.'
        required: false
        default: ''
      all_months:
        description: 'Set to "true" to sync every digest month (backfill).'
        required: false
        default: 'false'
      dry_run:
        description: 'Set to "true" to print entries without opening a PR'
        required: false
        default: 'false'

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve GitHub App token input
        id: app_config
        env:
          DIGEST_APP_CLIENT_ID: ${{ vars.DIGEST_APP_CLIENT_ID }}
          DIGEST_APP_ID: ${{ vars.DIGEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${DIGEST_APP_CLIENT_ID:-}" ]; then
            echo "::add-mask::$DIGEST_APP_CLIENT_ID"
            echo "mode=client-id" >> "$GITHUB_OUTPUT"
            echo "client_id=$DIGEST_APP_CLIENT_ID" >> "$GITHUB_OUTPUT"
          elif [ -n "${DIGEST_APP_ID:-}" ]; then
            echo "::add-mask::$DIGEST_APP_ID"
            echo "mode=app-id" >> "$GITHUB_OUTPUT"
            echo "app_id=$DIGEST_APP_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set DIGEST_APP_CLIENT_ID (or legacy DIGEST_APP_ID)."
            exit 1
          fi
      - uses: actions/create-github-app-token@v3
        id: app_token_client
        if: steps.app_config.outputs.mode == 'client-id'
        with:
          client-id: ${{ steps.app_config.outputs.client_id }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: EEG-FM-Digest,awesome-eeg-fm
      - uses: actions/create-github-app-token@v3
        id: app_token_legacy
        if: steps.app_config.outputs.mode == 'app-id'
        with:
          app-id: ${{ steps.app_config.outputs.app_id }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: EEG-FM-Digest,awesome-eeg-fm
      - name: Select GitHub App token
        id: app_token
        env:
          TOKEN_CLIENT: ${{ steps.app_token_client.outputs.token }}
          TOKEN_LEGACY: ${{ steps.app_token_legacy.outputs.token }}
        run: |
          set -euo pipefail
          token="${TOKEN_CLIENT:-${TOKEN_LEGACY:-}}"
          if [ -z "$token" ]; then
            echo "::error::GitHub App token was not created."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync new EEG foundation models to awesome-eeg-fm
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
          INPUT_ALL_MONTHS: ${{ github.event.inputs.all_months }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          # workflow_run has no month input. Scan every published month so a
          # Daily Digest backfill into older folders still gets synced.
          # README arXiv-id dedupe keeps reruns from duplicating entries.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] || [ "${INPUT_ALL_MONTHS:-}" = "true" ]; then
            args+=(--all-months)
          elif [ -n "${INPUT_MONTH:-}" ]; then
            args+=(--month "$INPUT_MONTH")
          fi
          if [ "${INPUT_DRY_RUN:-}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/sync_to_awesome.py "${args[@]}"
